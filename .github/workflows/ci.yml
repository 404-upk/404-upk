name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Стиль и уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pip-audit -r requirements.txt

  test:
    name: Тесты (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upk
          POSTGRES_PASSWORD: upk
          POSTGRES_DB: upk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upk -d upk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://upk:upk@localhost:5432/upk' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  e2e:
    name: Браузерные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Подача заявки, статус, панель, доска, тема, телефон, работа без сети
        run: python -m pytest tests/e2e

  frontend:
    name: Синтаксис JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка всех модулей
        run: |
          for f in $(find web/static/js -name '*.js'); do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "Ошибка в $f"; exit 1; }
          done

  docker:
    name: Сборка и запуск боевого окружения
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Настройки как на сервере
        run: |
          sed -e 's#^DOMAIN=.*#DOMAIN=localhost#' \
              -e 's#^PUBLIC_URL=.*#PUBLIC_URL=https://localhost#' \
              -e 's#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=ci-database-password#' \
              -e 's#^DEMO_ADMIN_PASSWORD=.*#DEMO_ADMIN_PASSWORD=ci-admin-password-1#' \
              -e 's#^DEMO_STAFF_PASSWORD=.*#DEMO_STAFF_PASSWORD=ci-staff-password-2#' \
              -e 's#^DEMO_EXECUTOR_PASSWORD=.*#DEMO_EXECUTOR_PASSWORD=ci-exec-password-3#' \
              deploy/.env.prod.example > .env
      - name: Запуск
        run: docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build --wait --wait-timeout 180
      - name: Сайт отвечает через HTTPS
        run: |
          curl -kfsS https://localhost/api/health | grep '"database":true'
          curl -kfsS https://localhost/ | grep -q 'https://localhost/static/img/og.png'
          curl -kfsSI https://localhost/ | grep -i 'strict-transport-security'
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/docs)" = "404"
      - name: Журналы при ошибке
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.prod.yml logs --tail=80
