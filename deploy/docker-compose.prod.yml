# Боевой запуск: HTTPS через Caddy, PostgreSQL, приложение закрыто от внешней сети.
#
#   cp deploy/.env.prod.example .env      заполнить все значения
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?укажите домен в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://upk:${POSTGRES_PASSWORD:?укажите пароль базы в .env}@db:5432/upk
    expose:
      - "8000"
    volumes:
      - upk-data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: upk
      POSTGRES_DB: upk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите пароль базы в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upk -d upk"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy-data:
  caddy-config:
  upk-data:
  db-data:
